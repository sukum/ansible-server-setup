[defaults]
inventory               = hosts
host_key_checking       = False
forks			= 10
pipelining 		= True
private_key_file	= ~/.ssh/ansible
interpreter_python	= auto_silent
action_warnings = False

[ssh_connection]
transfer_method = scp
ssh_args = -o IdentitiesOnly=yes -o ControlMaster=auto -o ControlPersist=600s

