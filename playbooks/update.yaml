- name: Update OS packages
  hosts: vps
  user: root
  vars_files:
    # - ../vars/vars
  vars:
    ansible_ssh_private_key_file: ~/.ssh/ansible
  tasks:
    - name: Update apt repo and cache
      ansible.builtin.apt:
        update_cache: true
        force_apt_get: true
        cache_valid_time: 432000
      when: ansible_os_family == 'Debian'
      tags:
        - update

    - name: Upgrade apt packages
      ansible.builtin.apt:
        upgrade: dist
        force_apt_get: true
      when: ansible_os_family == 'Debian'
      timeout: 450
      tags:
        - update

    - name: Upgrade yum packages
      ansible.builtin.yum:
        name: '*'
        state: latest
      when: ansible_os_family == 'RedHat'
      timeout: 450
      tags:
        - update

    - name: Upgrade alpine packages
      community.general.apk:
        update_cache: true
        upgrade: true
      when: ansible_distribution == 'Alpine'
      timeout: 450
      tags:
        - update

    - name: Check if a reboot is needed
      register: reboot_required_file
      ansible.builtin.stat:
        path: /var/run/reboot-required
        checksum_algorithm: md5
      when: ansible_os_family == 'Debian'
      tags:
        - reboot

    - name: Reboot the box if kernel updated
      ansible.builtin.reboot:
        msg: "Reboot initialized by ansible for kernel updates"
        connect_timeout: 5
        reboot_timeout: 60
        pre_reboot_delay: 0
        post_reboot_delay: 30
        test_command: uptime
      when:
        - ansible_os_family == 'Debian'
        - reboot_required_file.stat.exists
        - inventory_hostname not in groups['hdd'] | default([])

      tags:
        - reboot

    # "never" tag makes this not run by default. use "clean" tag to run this.
    - name: Remove dependencies that are no longer required
      ansible.builtin.apt:
        autoremove: true
      when: ansible_os_family == 'Debian'
      tags:
        - clean
        - never

    - name: Print a message
      ansible.builtin.debug:
        msg: 'All set'
      tags:
        - test
